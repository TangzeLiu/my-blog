<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章 · 我的技术笔记</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" id="hljs-light" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hljs-dark" disabled />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">📓</span>
        <span class="brand-name">我的技术笔记</span>
      </a>
      <nav class="site-nav">
        <a href="index.html">首页</a>
        <a href="archive.html">归档</a>
        <a href="about.html">关于</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题">🌙</button>
      </nav>
    </div>
  </header>

  <main class="container narrow">
    <article id="article" class="article">
      <p class="loading">正在加载文章…</p>
    </article>
    <div class="article-footer">
      <a class="back-link" href="index.html">← 返回首页</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> 我的技术笔记 · 用 HTML / CSS / JS 手写而成</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
  <script>
    // MathJax 配置：支持 $...$ 行内公式与 $$...$$ 块级公式
    // startup.typeset = false —— 不在页面加载时自动排版（此刻文章还没加载），
    // 改由 js/post.js 在正文插入后再手动触发排版。
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      startup: { typeset: false }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/post.js"></script>
</body>
</html>
